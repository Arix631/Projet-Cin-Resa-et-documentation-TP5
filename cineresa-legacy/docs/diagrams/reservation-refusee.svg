<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img"><title>Réservation — refus pour capacité insuffisante</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155"/></marker><marker id="realize" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="white" stroke="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172334;font-size:16px} .title{font-size:24px;font-weight:bold} .small{font-size:14px} .edge{fill:none;stroke:#334155;stroke-width:1.5} .dep{stroke-dasharray:6 4} .head{font-weight:bold}</style><text x="30" y="38" class="title" text-anchor="start"><tspan x="30" dy="0">Réservation — refus pour capacité insuffisante</tspan></text><line x1="80" y1="110" x2="80" y2="915" class="edge dep"/><rect x="15" y="65" width="130" height="60" rx="3" fill="#f8fafc" stroke="#475569"/><text x="80.0" y="87" class="" text-anchor="middle"><tspan x="80.0" dy="0">«component»</tspan><tspan x="80.0" dy="21">Client</tspan></text><line x1="300" y1="110" x2="300" y2="915" class="edge dep"/><rect x="195" y="65" width="210" height="60" rx="3" fill="#f8fafc" stroke="#475569"/><text x="300.0" y="87" class="" text-anchor="middle"><tspan x="300.0" dy="0">«component»</tspan><tspan x="300.0" dy="21">httpRouter</tspan></text><line x1="540" y1="110" x2="540" y2="915" class="edge dep"/><rect x="435" y="65" width="210" height="60" rx="3" fill="#f8fafc" stroke="#475569"/><text x="540.0" y="87" class="" text-anchor="middle"><tspan x="540.0" dy="0">«component»</tspan><tspan x="540.0" dy="21">BookSeatsService</tspan></text><line x1="800" y1="110" x2="800" y2="915" class="edge dep"/><rect x="695" y="65" width="210" height="60" rx="3" fill="#f8fafc" stroke="#475569"/><text x="800.0" y="87" class="" text-anchor="middle"><tspan x="800.0" dy="0">«component»</tspan><tspan x="800.0" dy="21">ScreeningRepository</tspan></text><line x1="1040" y1="110" x2="1040" y2="915" class="edge dep"/><rect x="935" y="65" width="210" height="60" rx="3" fill="#f8fafc" stroke="#475569"/><text x="1040.0" y="87" class="" text-anchor="middle"><tspan x="1040.0" dy="0">«component»</tspan><tspan x="1040.0" dy="21">IdGenerator / Clock</tspan></text><line x1="1250" y1="110" x2="1250" y2="915" class="edge dep"/><rect x="1145" y="65" width="210" height="60" rx="3" fill="#f8fafc" stroke="#475569"/><text x="1250.0" y="87" class="" text-anchor="middle"><tspan x="1250.0" dy="0">«component»</tspan><tspan x="1250.0" dy="21">Screening</tspan></text><line x1="1470" y1="110" x2="1470" y2="915" class="edge dep"/><rect x="1365" y="65" width="210" height="60" rx="3" fill="#f8fafc" stroke="#475569"/><text x="1470.0" y="87" class="" text-anchor="middle"><tspan x="1470.0" dy="0">«component»</tspan><tspan x="1470.0" dy="21">domainErrorHandler</tspan></text><polyline points="80,172 300,172" class="edge " marker-end="url(#arrow)"/><text x="190.0" y="162" class="small" text-anchor="middle"><tspan x="190.0" dy="0">POST /screenings/s1/bookings</tspan></text><text x="180" y="196" class="small" text-anchor="middle"><tspan x="180" dy="0">email valide, seats=5</tspan></text><polyline points="300,235 540,235" class="edge " marker-end="url(#arrow)"/><text x="420.0" y="225" class="small" text-anchor="middle"><tspan x="420.0" dy="0">execute(command)</tspan></text><polyline points="540,285 800,285" class="edge " marker-end="url(#arrow)"/><text x="670.0" y="275" class="small" text-anchor="middle"><tspan x="670.0" dy="0">findById(&quot;s1&quot;)</tspan></text><polyline points="800,335 540,335" class="edge dep" marker-end="url(#arrow)"/><text x="670.0" y="325" class="small" text-anchor="middle"><tspan x="670.0" dy="0">copie de Screening : 4 places restantes</tspan></text><rect x="410" y="355" width="390" height="57" fill="#fff7db" stroke="#bca450"/><text x="425" y="377" class="small" text-anchor="start"><tspan x="425" dy="0">new Email(...), new SeatCount(5)</tspan><tspan x="425" dy="21">tarif NORMAL</tspan></text><polyline points="540,450 1040,450" class="edge " marker-end="url(#arrow)"/><text x="790.0" y="440" class="small" text-anchor="middle"><tspan x="790.0" dy="0">ids.next(), clock.now()</tspan></text><polyline points="1040,500 540,500" class="edge dep" marker-end="url(#arrow)"/><text x="790.0" y="490" class="small" text-anchor="middle"><tspan x="790.0" dy="0">bookingId, now</tspan></text><polyline points="540,550 1250,550" class="edge " marker-end="url(#arrow)"/><text x="895.0" y="540" class="small" text-anchor="middle"><tspan x="895.0" dy="0">book(request)</tspan></text><rect x="20" y="575" width="1545" height="335" fill="none" stroke="#475569" stroke-width="2"/><rect x="20" y="575" width="55" height="30" fill="#e2e8f0" stroke="#475569"/><text x="32" y="596" class="head" text-anchor="start"><tspan x="32" dy="0">alt</tspan></text><text x="95" y="598" class="head" text-anchor="start"><tspan x="95" dy="0">[demande &gt; places restantes : 5 &gt; 4]</tspan></text><polyline points="1250,642 540,642" class="edge dep" marker-end="url(#arrow)"/><text x="895.0" y="632" class="small" text-anchor="middle"><tspan x="895.0" dy="0">lève DomainError(CONFLICT, &quot;Plus assez de places&quot;)</tspan></text><polyline points="540,692 300,692" class="edge dep" marker-end="url(#arrow)"/><text x="420.0" y="682" class="small" text-anchor="middle"><tspan x="420.0" dy="0">promesse rejetée</tspan></text><polyline points="300,742 1470,742" class="edge " marker-end="url(#arrow)"/><text x="885.0" y="732" class="small" text-anchor="middle"><tspan x="885.0" dy="0">next(error) via asyncHandler</tspan></text><polyline points="1470,792 80,792" class="edge dep" marker-end="url(#arrow)"/><text x="775.0" y="782" class="small" text-anchor="middle"><tspan x="775.0" dy="0">HTTP 409 — {&quot;error&quot;:&quot;Plus assez de places&quot;}</tspan></text><text x="560" y="821" class="small" text-anchor="start"><tspan x="560" dy="0">Aucun paiement, save ou publish pour cette demande.</tspan></text><line x1="20" y1="838" x2="1565" y2="838" class="edge dep"/><text x="35" y="860" class="small" text-anchor="start"><tspan x="35" dy="0">[else : places suffisantes et séance future]</tspan></text><polyline points="1250,892 540,892" class="edge dep" marker-end="url(#arrow)"/><text x="895.0" y="882" class="small" text-anchor="middle"><tspan x="895.0" dy="0">Booking confirmé dans l’agrégat — suite du succès hors périmètre</tspan></text><text x="30" y="970" class="" text-anchor="start"><tspan x="30" dy="0">Légende : flèche pleine = appel ; pointillée = retour ou erreur propagée.</tspan><tspan x="30" dy="21">ScreeningRepository est utilisé via InMemoryScreeningRepository.</tspan><tspan x="30" dy="21">IdGenerator / Clock sont utilisés via UuidGenerator / SystemClock.</tspan><tspan x="30" dy="21">Préconditions : séance future, e-mail valide, nombre entre 1 et 6.</tspan></text></svg>